# Deploys the BannerPromote site to the web host over SFTP.
#
# Connection details come from encrypted repository secrets
# (Settings > Secrets and variables > Actions):
#   SFTP_HOST      server address
#   SFTP_USER      SFTP user name
#   SFTP_PASSWORD  SFTP password
#   SFTP_PORT      optional, default 22
#   SFTP_DIR       optional, folder to deploy into; default "." = the folder
#                  you land in when you log in (/public_html on this host)
#
# What it never does:
#   - upload or overwrite config.php (your passwords live there)
#   - touch the uploads/ folder (advertisers' banner images)
#   - delete anything on the server
#   - upload setup.php / import.php, unless you tick "Include setup.php and import.php"
#
# Runs automatically after every push to main that passes the tests, and
# whenever you start it (Actions > Deploy > Run workflow). To turn off the
# automatic deploys, add a repository variable AUTO_DEPLOY = false
# (Settings > Secrets and variables > Actions > Variables).

name: Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: connect and list what would be uploaded, change nothing"
        type: boolean
        default: true
      include_setup:
        description: "Include setup.php and import.php (one-time database setup / banner import tools)"
        type: boolean
        default: false
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs always; automatic runs only for pushes to main whose tests passed
    # (unless turned off with AUTO_DEPLOY = false).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY != 'false' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      INCLUDE_SETUP: ${{ github.event_name == 'workflow_dispatch' && inputs.include_setup || false }}
      SITE_URL: ${{ vars.SITE_URL || 'https://bannerpromote.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build the site files
        run: |
          # Sitemap <lastmod> = date of the latest commit (accurate dates help Google and Bing).
          php install.php --dir=build/site --lastmod="$(git log -1 --format=%cs)"
          # Blog: validates every article (fails the deploy if one breaks the SEO rules),
          # writes blog pages, RSS feed and adds articles to sitemap.xml.
          php tools/build-blog.php --site=build/site
          rm -f build/site/config.php            # never overwrite the live config
          rm -rf build/site/uploads              # never touch uploaded banners
          if [ "$INCLUDE_SETUP" != "true" ]; then rm -f build/site/setup.php build/site/import.php; fi
          echo "Files to deploy:"; ls -la build/site

      - name: Install the SFTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null && lftp --version | head -1

      - name: Check the connection secrets
        env:
          H: ${{ secrets.SFTP_HOST }}
          U: ${{ secrets.SFTP_USER }}
          P: ${{ secrets.SFTP_PASSWORD }}
          PORT: ${{ secrets.SFTP_PORT }}
          DIR: ${{ secrets.SFTP_DIR }}
        run: |
          # Remove stray spaces / line breaks that sneak in when pasting secrets.
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//'; }
          h=$(clean "$H"); u=$(clean "$U"); port=$(clean "$PORT"); dir=$(clean "$DIR")
          pw=$(printf '%s' "$P" | tr -d '\r\n')
          missing=""
          [ -n "$h" ]  || missing="$missing SFTP_HOST"
          [ -n "$u" ]  || missing="$missing SFTP_USER"
          [ -n "$pw" ] || missing="$missing SFTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "::add-mask::$h"; echo "::add-mask::$u"; echo "::add-mask::$pw"
          [ "$h" = "$H" ]  || echo "::notice::SFTP_HOST had extra spaces or line breaks around it; they were removed."
          [ "$u" = "$U" ]  || echo "::notice::SFTP_USER had extra spaces or line breaks around it; they were removed."
          [ "$pw" = "$P" ] || echo "::notice::SFTP_PASSWORD had a line break in it; it was removed."
          case "$u" in *[!A-Za-z0-9._@-]*)
            echo "::error::SFTP_USER contains a character a user name can't have (for example a quote or a space in the middle). Re-enter it: it should be just the user name."
            exit 1;; esac
          case "$h" in *[!A-Za-z0-9.:-]*)
            echo "::error::SFTP_HOST should be only the server address (e.g. 173.249.54.18), without sftp:// or a port."
            exit 1;; esac
          case "${port:-22}" in *[!0-9]*) echo "::error::SFTP_PORT must be a number (usually 22)."; exit 1;; esac
          {
            echo "SFTP_H=$h"; echo "SFTP_U=$u"; echo "SFTP_P=${port:-22}"; echo "SFTP_D=${dir:-.}"
            echo "LFTP_PASSWORD<<PW_END_9c41f"; printf '%s\n' "$pw"; echo "PW_END_9c41f"
          } >> "$GITHUB_ENV"
          echo "All connection secrets are set (user name: ${#u} characters, port ${port:-22})."

      - name: Check the server is ready (config.php present)
        run: |
          out=$(lftp -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20;
                         open -p $SFTP_P -u $SFTP_U --env-password sftp://$SFTP_H;
                         cd $SFTP_D; pwd; cls -1; bye" 2>&1) || {
            echo "::error::Could not log in or open the folder. Check SFTP_HOST, SFTP_USER, SFTP_PASSWORD (and SFTP_PORT/SFTP_DIR if set)."
            echo "$out"
            exit 1
          }
          echo "Connected. Current server folder and contents:"; echo "$out"
          if ! echo "$out" | grep -qx 'config.php'; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::config.php is not on the server yet. Upload your filled-in config.php once before a real deploy."
            else
              echo "::error::config.php is not on the server. Upload your filled-in config.php first (see GO-LIVE steps), then deploy again. Nothing was changed."
              exit 1
            fi
          fi

      - name: Upload files (nothing is uploaded on a dry run)
        shell: bash   # bash -eo pipefail: a failed upload fails the step even through tee
        run: |
          src="$GITHUB_WORKSPACE/build/site"
          # Guard: only ever send the built site, never the repository itself.
          if [ ! -f "$src/advertise.php" ] || [ -e "$src/.git" ] || [ -e "$src/install.php" ] || [ -e "$src/config.php" ]; then
            echo "::error::The folder to upload is not the built site. Nothing was uploaded."; exit 1
          fi
          dry=""; [ "$DRY_RUN" = "true" ] && dry="--dry-run"
          # One lftp command per line (lftp treats each line as a separate command).
          # --reverse uploads local -> server. No --delete: nothing on the server is removed.
          cat > "$RUNNER_TEMP/deploy.lftp" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30
          open -p $SFTP_P -u $SFTP_U --env-password sftp://$SFTP_H
          cd $SFTP_D
          lcd $src
          mirror --reverse --verbose $dry --no-perms --exclude-glob config.php --exclude-glob config.local.php --exclude-glob uploads/ ./ ./
          bye
          LFTP
          echo "lftp commands:"; sed -E 's/(-u )[^ ]+/\1***/; s#(sftp://)[^ ]+#\1***#' "$RUNNER_TEMP/deploy.lftp"
          lftp -f "$RUNNER_TEMP/deploy.lftp" | tee "$RUNNER_TEMP/mirror.log"
          # Second guard: the transfer list must only contain built-site files.
          if grep -qE "\.git/|install\.php|README\.md|tests/|config\.php'" "$RUNNER_TEMP/mirror.log"; then
            echo "::error::Unexpected files in the transfer list. Check the log."; exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run finished. Nothing was uploaded. Run again with 'Dry run' unticked to deploy."
          fi

      - name: Check the live site
        if: env.DRY_RUN != 'true'
        run: |
          bad=""
          for page in "" advertise.php pricing.php banner-ad-sizes.php how-to-buy-banner-ads.php faq.php privacy.php terms.php contact.php blog/ blog/feed.xml \
                      admin.php embed.js.php style.css favicon.svg robots.txt sitemap.xml og-image.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/$page" || echo 000)
            echo "$SITE_URL/$page -> HTTP $code"
            [ "$code" = "200" ] || bad="$bad $page($code)"
          done
          # Confirm it is the version just deployed, not an older copy.
          curl -s --max-time 20 "$SITE_URL/advertise.php" | grep -q 'class="wordmark"' || bad="$bad advertise.php(old version or error)"
          curl -s --max-time 20 "$SITE_URL/embed.js.php" | grep -q '&site=' || bad="$bad embed.js.php(old version)"
          curl -s --max-time 20 "$SITE_URL/" | grep -q 'rel="canonical"' || bad="$bad home-page(old version)"
          curl -s --max-time 20 "$SITE_URL/sitemap.xml" | grep -q '<urlset' || bad="$bad sitemap.xml(invalid)"
          curl -s --max-time 20 "$SITE_URL/blog/" | grep -q 'post-card' || bad="$bad blog(no articles)"
          curl -s --max-time 20 "$SITE_URL/" | grep -q 'googletagmanager.com/gtm.js' || bad="$bad home-page(no Tag Manager)"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/fonts/archivo.woff2"); [ "$code" = 200 ] || bad="$bad fonts($code)"
          j=$(curl -s --max-time 20 "$SITE_URL/serve.php?spot=leaderboard&site=deploy-check.invalid")
          echo "serve.php -> $j"
          echo "$j" | grep -q '"width":728' || bad="$bad serve.php(database not reachable?)"
          # The server's bare IP address must not show the site (only the domain, through Cloudflare).
          ip=$(printf '%s' "$SFTP_H" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          if printf '%s' "$ip" | grep -qE '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            for u in "https://$ip/" "https://$ip/pricing.php" "http://$ip/"; do
              r=$(curl -sk -o "$RUNNER_TEMP/ip.html" -w '%{http_code}' --max-time 20 "$u" || echo 000)
              if grep -q 'BannerPromote' "$RUNNER_TEMP/ip.html" 2>/dev/null; then
                echo "::warning::The bare server IP still shows the site ($u -> HTTP $r). The web server may ignore .htaccess (e.g. nginx)."
              else
                echo "Bare server IP blocked: ${u/$ip/<server-ip>} -> HTTP $r"
              fi
            done
          fi
          if [ -n "$bad" ]; then
            echo "::error::Uploaded, but these checks failed:$bad. Common causes: database details in config.php, setup.php not run yet, PHP below 8.1."
            exit 1
          fi
          echo "::notice::Deployed and verified. $SITE_URL is live."

      - name: Notify Bing and other IndexNow search engines
        if: env.DRY_RUN != 'true' && success()
        shell: bash
        run: |
          key=$(ls build/site | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          host=$(printf '%s' "$SITE_URL" | sed -E 's#^https?://##; s#/.*$##')
          urls=$(curl -s --max-time 20 "$SITE_URL/sitemap.xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g')
          if [ -z "$key" ] || [ -z "$urls" ]; then echo "::warning::Skipped IndexNow (no key file or empty sitemap)."; exit 0; fi
          body=$(printf '%s\n' "$urls" | python3 -c 'import json,sys; print(json.dumps({"host":sys.argv[1],"key":sys.argv[2],"keyLocation":sys.argv[3],"urlList":[l.strip() for l in sys.stdin if l.strip()]}))' \
                 "$host" "$key" "$SITE_URL/$key.txt")
          code=$(curl -s -o "$RUNNER_TEMP/indexnow.txt" -w '%{http_code}' --max-time 30 -X POST https://api.indexnow.org/indexnow \
                 -H 'Content-Type: application/json; charset=utf-8' -d "$body" || echo 000)
          echo "IndexNow -> HTTP $code for $(printf '%s\n' "$urls" | wc -l) URLs"
          case "$code" in
            200|202) echo "::notice::Submitted $(printf '%s\n' "$urls" | wc -l) pages to Bing via IndexNow." ;;
            *) echo "::warning::IndexNow returned HTTP $code (the deploy itself succeeded): $(head -c 300 "$RUNNER_TEMP/indexnow.txt")" ;;
          esac

      - name: Diagnose problems
        # Runs on dry runs and whenever an earlier step failed. Changes nothing on the server.
        if: always() && (env.DRY_RUN == 'true' || failure()) && env.SFTP_H != ''
        shell: bash
        run: |
          echo "Checking config.php on the server (values are never printed)..."
          cfg="$RUNNER_TEMP/config.check.php"
          printf 'set sftp:auto-confirm yes\nset net:max-retries 2\nopen -p %s -u %s --env-password sftp://%s\ncd %s\nget config.php -o %s\nbye\n' \
            "$SFTP_P" "$SFTP_U" "$SFTP_H" "$SFTP_D" "$cfg" > "$RUNNER_TEMP/get.lftp"
          if ! lftp -f "$RUNNER_TEMP/get.lftp" >/dev/null 2>&1 || [ ! -s "$cfg" ]; then
            echo "::warning::Could not read config.php from the server."
          else
            todo=""
            grep -q "'YOUR_DATABASE_NAME'"     "$cfg" && todo="$todo GB_DB_NAME"
            grep -q "'YOUR_DATABASE_USER'"     "$cfg" && todo="$todo GB_DB_USER"
            grep -q "'YOUR_DATABASE_PASSWORD'" "$cfg" && todo="$todo GB_DB_PASS"
            grep -q "'CHANGE-ME-NOW'"          "$cfg" && todo="$todo GB_ADMIN_PASSWORD"
            grep -q "'greenbox'"               "$cfg" && todo="$todo GB_DB_NAME(old default)"
            grep -q "define('GB_DB_USER', 'root')" "$cfg" && todo="$todo GB_DB_USER(old default)"
            grep -q "YOUR-PAYPAL-EMAIL"        "$cfg" && echo "::notice::GB_PAYPAL_BUSINESS is still the placeholder (only needed before taking PayPal payments)."
            grep -q "GB_BRAND_NAME"            "$cfg" || echo "::notice::config.php is an older version without GB_BRAND_NAME; the site will still show BannerPromote."
            php -l "$cfg" >/dev/null 2>&1 || echo "::error::config.php on the server has a PHP syntax error (often a missing quote or semicolon after editing)."
            if [ -n "$todo" ]; then
              echo "::error::config.php on the server still has placeholder values for:$todo. Fill these in and upload config.php again."
            else
              echo "config.php: all required settings are filled in."
            fi
            rm -f "$cfg"
          fi
          echo "Live placements and prices (from the public order page):"
          curl -s --max-time 20 "$SITE_URL/advertise.php" > "$RUNNER_TEMP/adv.html" || true
          echo "advertise.php -> HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/advertise.php")"
          php -r '$h=(string)file_get_contents($argv[1]);
            preg_match_all("~placement-name\">([^<]+)</span>\s*<span class=\"placement-size\">([^<]+)</span>\s*<span class=\"placement-price\"><strong>([^<]+)</strong>([A-Z]{3})\s*for (\d+) days~", $h, $m, PREG_SET_ORDER);
            foreach ($m as $r) printf("  %-18s %-14s %s %s for %s days\n", html_entity_decode($r[1]), html_entity_decode($r[2]), $r[3], $r[4], $r[5]);
            if (!$m) echo "  (no placements found on the page)\n";' "$RUNNER_TEMP/adv.html"
          echo "Banners being served right now:"
          for slot in medium-rectangle leaderboard full-banner mobile-banner skyscraper half-page large-rectangle square; do
            r=$(curl -s --max-time 20 "$SITE_URL/serve.php?spot=$slot&site=deploy-check.invalid")
            echo "$r" | grep -q '"html":null' && echo "  $slot: none" || echo "  $slot: $(echo "$r" | grep -o 'go.php?id=[0-9]*' | head -1 || echo "$r" | head -c 120)"
          done
          echo "Setup page status:"
          curl -s --max-time 20 "$SITE_URL/setup.php" | sed -E 's/<[^>]+>/ /g; s/[[:space:]]+/ /g' | grep -oE "(Set a strong[^.]*\.|Run setup|Could not use the database[^.]*\.)" | head -3 || true
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/setup.php" || echo 000)
          echo "setup.php -> HTTP $code"
          [ "$code" = "404" ] && echo "setup.php is not on the server (fine if setup was already run)."
          true

