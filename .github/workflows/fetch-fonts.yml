# One-off helper: downloads the site's web fonts (Latin subset, WOFF2) and
# their licenses so they can be hosted on our own server instead of Google.
# Actions > Fetch fonts > Run workflow, then download the "fonts" artifact.

name: Fetch fonts

on:
  workflow_dispatch:

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Download WOFF2 files and licenses
        shell: bash
        run: |
          mkdir -p out/fonts
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sSf -A "$UA" "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" > google.css
          python3 - <<'PY'
          import re, urllib.request
          css = open("google.css").read()
          blocks = re.findall(r"/\* ([a-z-]+) \*/\s*(@font-face\s*{[^}]+})", css)
          out = []
          for subset, block in blocks:
              if subset != "latin":
                  continue
              fam = re.search(r"font-family:\s*'([^']+)'", block).group(1)
              weight = re.search(r"font-weight:\s*([^;]+);", block).group(1).strip()
              url = re.search(r"url\((https://[^)]+\.woff2)\)", block).group(1)
              name = re.sub(r"[^a-z0-9]+", "-", f"{fam} {weight}".lower()).strip("-") + ".woff2"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              open(f"out/fonts/{name}", "wb").write(urllib.request.urlopen(req).read())
              out.append(block.replace(url, f"fonts/{name}"))
              print("fetched", fam, weight, "->", name)
          open("out/fonts.css", "w").write("\n".join(out) + "\n")
          PY
          curl -sSf https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/OFL.txt > out/fonts/OFL-Archivo.txt
          curl -sSf https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsans/OFL.txt > out/fonts/OFL-IBMPlexSans.txt
          cat out/fonts.css; ls -la out/fonts

      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: out/
          retention-days: 1
